<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gold-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="50%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <linearGradient id="cap-top-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF566" />
      <stop offset="40%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#E59D00" />
    </linearGradient>

    <linearGradient id="cap-base-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E59900" />
      <stop offset="30%" stop-color="#FFD600" />
      <stop offset="70%" stop-color="#FFE143" />
      <stop offset="100%" stop-color="#CC8800" />
    </linearGradient>

    <!-- Paths for circular text -->
    <!-- Top arc: Radius 238, from 215 deg to -35 deg -->
    <path id="topTextArc" d="M 82,335 A 238,238 0 1,1 518,335" fill="none" />
    <!-- Bottom arc: Radius 240, from 145 deg to 35 deg -->
    <path id="bottomTextArc" d="M 505,335 A 238,238 0 0,1 95,335" fill="none" />
  </defs>

  <!-- Outer Ring Elements -->
  <!-- Outer Yellow Ring Border with black outer stroke -->
  <circle cx="300" cy="300" r="286" fill="#FFE500" stroke="#000000" stroke-width="8" />
  
  <!-- Outer Dark Ring -->
  <circle cx="300" cy="300" r="264" fill="#202124" stroke="#000000" stroke-width="4" />

  <!-- Inner Yellow Ring -->
  <circle cx="300" cy="300" r="214" fill="#202124" stroke="#FFE500" stroke-width="8" />

  <!-- Circular Text: Upper Arc -->
  <text fill="#FFE500" font-family="'Outfit', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      INSTITUT PRIVE AFRICAIN EN INFORMATIQUE
    </textPath>
  </text>

  <!-- Stars -->
  <!-- Left Star -->
  <g transform="translate(68, 365) rotate(15) scale(1.6)">
    <polygon points="0,-12 3.5,-3.5 12,-3.5 5,2 7.5,10.5 0,5.5 -7.5,10.5 -5,2 -12,-3.5 -3.5,-3.5" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" />
  </g>
  <!-- Right Star -->
  <g transform="translate(532, 365) rotate(-15) scale(1.6)">
    <polygon points="0,-12 3.5,-3.5 12,-3.5 5,2 7.5,10.5 0,5.5 -7.5,10.5 -5,2 -12,-3.5 -3.5,-3.5" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" />
  </g>

  <!-- Circular Text: Lower Arc -->
  <text fill="#FFE500" font-family="'Outfit', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="31" letter-spacing="2">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ET MANAGEMENT DE THIÈS
    </textPath>
  </text>

  <!-- ==================== CENTER EMBLEM ==================== -->

  <!-- 1. Text IPAIM in White Serif at Top of Center -->
  <text x="300" y="160" text-anchor="middle" fill="#FFFFFF" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="46" letter-spacing="4">
    IPAIM
  </text>

  <!-- 2. Graduation Cap (Mortarboard) -->
  <!-- Skullcap (base) under diamond -->
  <path d="M 216,230 Q 300,256 384,230 L 375,296 Q 300,328 225,296 Z" fill="url(#cap-base-grad)" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Mortarboard Diamond Top -->
  <polygon points="300,174 436,216 300,260 164,216" fill="url(#cap-top-grad)" stroke="#111111" stroke-width="4" stroke-linejoin="round" />

  <!-- Center Button on Cap -->
  <ellipse cx="300" cy="217" rx="6" ry="3.5" fill="#FFB300" stroke="#111" stroke-width="1.5" />

  <!-- Tassel Cord and Fringe -->
  <path d="M 300,218 Q 370,225 396,260" fill="none" stroke="#E59900" stroke-width="3" stroke-linecap="round" />
  <circle cx="396" cy="260" r="3.5" fill="#E59900" />
  <path d="M 396,260 L 398,284 M 394,260 L 392,284 M 396,260 L 395,286" stroke="#FFD000" stroke-width="2" stroke-linecap="round" />

  <!-- 3. Two Spread White Wings / Feathers -->
  <!-- Left Wing -->
  <g stroke="#111111" stroke-width="2" stroke-linejoin="round">
    <path d="M 206,346 C 180,310 145,265 122,206 C 132,230 146,242 160,250 C 145,236 136,215 132,198 C 146,220 162,230 178,240 C 166,222 158,198 156,182 C 172,210 190,226 206,238 C 200,218 195,198 196,176 C 210,212 226,246 206,346 Z" fill="#FFFFFF" />
  </g>

  <!-- Right Wing (Mirror) -->
  <g stroke="#111111" stroke-width="2" stroke-linejoin="round">
    <path d="M 394,346 C 420,310 455,265 478,206 C 468,230 454,242 440,250 C 455,236 464,215 468,198 C 454,220 438,230 422,240 C 434,222 442,198 444,182 C 428,210 410,226 394,238 C 400,218 405,198 404,176 C 390,212 374,246 394,346 Z" fill="#FFFFFF" />
  </g>

  <!-- 4. Open Book -->
  <g stroke="#111111" stroke-width="3.5" stroke-linejoin="round">
    <!-- Book 3D Pages Thickness Base -->
    <path d="M 194,440 Q 248,452 296,444 L 296,454 Q 248,462 190,450 Z" fill="#E2E2E2" />
    <path d="M 406,440 Q 352,452 304,444 L 304,454 Q 352,462 410,450 Z" fill="#E2E2E2" />
    <path d="M 296,454 L 304,454 L 304,444 L 296,444 Z" fill="#B0B0B0" />

    <!-- Left Open Page -->
    <path d="M 300,340 C 265,332 225,338 196,350 L 194,440 C 225,430 265,424 300,432 Z" fill="#FFFFFF" />

    <!-- Right Open Page -->
    <path d="M 300,340 C 335,332 375,338 404,350 L 406,440 C 375,430 335,424 300,432 Z" fill="#FFFFFF" />
    
    <!-- Center Spine crease -->
    <path d="M 300,340 L 300,432" stroke="#444444" stroke-width="2.5" />
  </g>

  <!-- 5. Golden Africa Silhouette on Left Page -->
  <!-- Stylized silhouette of African continent in gold/orange -->
  <g transform="translate(216, 356) scale(0.64)">
    <path d="M 42,6 C 54,4 66,7 72,16 C 75,22 74,28 78,32 C 84,38 96,42 98,50 C 99,56 94,62 90,66 C 88,72 90,78 86,84 C 82,90 76,96 74,104 C 70,116 62,128 54,136 C 50,140 44,142 42,136 C 40,126 36,116 32,108 C 28,102 24,96 22,88 C 18,80 14,72 8,66 C 4,60 2,54 4,46 C 6,36 12,32 18,26 C 24,20 32,8 42,6 Z" 
          fill="#FFB800" stroke="#D49000" stroke-width="1.5" />
    <!-- Madagascar island -->
    <ellipse cx="88" cy="116" rx="4" ry="10" transform="rotate(20 88 116)" fill="#FFB800" stroke="#D49000" stroke-width="1" />
  </g>
</svg>
